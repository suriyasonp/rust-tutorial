name: Publish Rust tutorial Pages

on:
  push:
    branches: [main]
    paths:
      - README.md
      - LICENSE
      - docs/**
      - labs/**
      - solutions/README.md
      - solutions/sensor-validation/src/main.rs
      - solutions/log-summary/src/main.rs
      - site-assets/**
      - tools/build_site_source.py
      - mkdocs.yml
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - README.md
      - docs/**
      - labs/**
      - solutions/README.md
      - site-assets/**
      - tools/build_site_source.py
      - mkdocs.yml
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-tutorial-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MkDocs
        run: python -m pip install mkdocs==1.6.1
      - name: Prepare site content
        run: python tools/build_site_source.py
      - name: Build and validate site
        run: python -m mkdocs build --strict
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
